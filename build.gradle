plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
    def obfuscated = project.findProperty('obfuscated') == 'true'
    def javaVersion = (project.findProperty('java_version') ?: '25') as int
    apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

    version = "${rootProject.mod_version}+${project.minecraft_version}"
    group = rootProject.maven_group

    base {
        archivesName = rootProject.archives_base_name
    }

    repositories {
        mavenCentral()
    }

    sourceSets {
        main {
            java.srcDirs = [rootProject.file('src/main/java'), file('src/main/java')]
            resources.srcDirs = [rootProject.file('src/main/resources')]
        }
        test {
            java.srcDirs = [rootProject.file('src/test/java')]
            resources.srcDirs = [rootProject.file('src/test/resources')]
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        if (obfuscated) {
            mappings loom.officialMojangMappings()
            modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        } else {
            implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        }

        testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
        testImplementation platform("org.junit:junit-bom:5.11.4")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    processResources {
        def props = [version: project.version, minecraft_dependency: project.minecraft_dependency,
                java_dependency: ">=${javaVersion}"]
        inputs.properties props
        filesMatching("fabric.mod.json") {
            expand props
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = javaVersion
        it.options.encoding = "UTF-8"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    test {
        useJUnitPlatform()
        maxHeapSize = "3G"
        testLogging {
            events "passed", "failed", "skipped"
            exceptionFormat "full"
        }
    }
}

tasks.register('collectJars', Copy) {
    dependsOn subprojects.collect { "${it.path}:assemble" }
    from(subprojects.collect { it.layout.buildDirectory.dir('libs') }) {
        exclude '*-sources.jar'
    }
    into layout.buildDirectory.dir('libs')
}
